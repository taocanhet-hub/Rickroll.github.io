<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cảnh Báo Tự Hủy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, * {
      font-family: Arial, Helvetica, sans-serif !important;
      user-select: none;
    }

    /* Hiệu ứng quét dòng CRT */
    .crt-scanlines {
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0) 50%,
        rgba(0, 0, 0, 0.35) 50%,
        rgba(0, 0, 0, 0.35)
      );
      background-size: 100% 4px;
      pointer-events: none;
    }

    /* Rung lắc dữ dội khi phát nổ */
    @keyframes screen-quake {
      0% { transform: translate(0, 0) scale(1); }
      10% { transform: translate(-12px, 8px) scale(1.02); }
      20% { transform: translate(14px, -10px) scale(0.99); }
      30% { transform: translate(-10px, -12px) scale(1.03); }
      40% { transform: translate(12px, 10px) scale(1); }
      50% { transform: translate(-8px, 6px) scale(1.02); }
      60% { transform: translate(10px, -6px) scale(0.99); }
      70% { transform: translate(-6px, 8px) scale(1.01); }
      80% { transform: translate(6px, -4px) scale(1); }
      100% { transform: translate(0, 0) scale(1); }
    }

    .shaking {
      animation: screen-quake 0.12s infinite;
    }

    /* Chớp sáng cực mạnh khi nổ */
    @keyframes explosion-flash {
      0% { opacity: 0.95; }
      20% { opacity: 0.1; }
      35% { opacity: 0.8; }
      100% { opacity: 0; }
    }

    .flash-overlay {
      animation: explosion-flash 0.5s ease-out forwards;
    }
  </style>
</head>
<body id="main-body" class="w-screen h-screen m-0 p-0 bg-white flex items-center justify-center overflow-hidden transition-colors duration-200">

  <!-- ==================== 0. MÀN HÌNH YÊU CẦU TOÀN MÀN HÌNH ==================== -->
  <section id="step-fullscreen-prompt" class="flex flex-col items-center justify-center w-full h-full text-center px-4">
    <p class="text-gray-700 text-base mb-4 font-normal">Vui lòng bật toàn màn hình để tiếp tục</p>
    <button 
      id="btn-fullscreen" 
      class="px-6 py-2.5 bg-gray-900 hover:bg-black active:scale-95 text-white text-base font-normal rounded cursor-pointer transition-all shadow-sm outline-none border-none"
    >
      Bật toàn màn hình
    </button>
  </section>

  <!-- ==================== 1. MÀN HÌNH BẮT ĐẦU: TỐI GIẢN ==================== -->
  <section id="step-start" class="hidden flex items-center justify-center w-full h-full">
    <button 
      id="btn-click" 
      class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white text-base font-normal rounded cursor-pointer transition-all shadow-sm outline-none border-none"
    >
      Bấm vào đây
    </button>
  </section>

  <!-- ==================== 2. MÀN HÌNH LOADING TRONG 3 GIÂY ==================== -->
  <section id="step-loading" class="hidden flex-col items-center justify-center gap-3">
    <div class="w-10 h-10 border-4 border-gray-200 border-t-blue-600 rounded-full animate-spin"></div>
    <span class="text-sm text-gray-500 font-normal">Đang tải...</span>
  </section>

  <!-- ==================== 3. MÀN HÌNH ĐỒ HỌA MÁY TÍNH & ĐẦU LÂU ☠ ==================== -->
  <section id="step-graphic" class="hidden absolute inset-0 w-full h-full bg-black flex items-center justify-center overflow-hidden">
    <!-- Lớp lưới sọc quét CRT -->
    <div class="crt-scanlines absolute inset-0 z-20"></div>

    <!-- Đồ họa Vector SVG -->
    <svg id="scene-svg" viewBox="0 0 1920 1080" class="w-full h-full max-w-full max-h-full object-contain" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- Họa tiết dải sọc chéo Hazard đỏ và đen -->
        <pattern id="hazardStripes" width="160" height="160" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="0" y2="160" stroke="#990b14" stroke-width="80" />
          <line x1="80" y1="0" x2="80" y2="160" stroke="#0f0506" stroke-width="80" />
        </pattern>

        <!-- Ký hiệu Nguy Hiểm Sinh Học (Biohazard) -->
        <g id="biohazard-symbol" fill="#000000" fill-opacity="0.82">
          <circle cx="0" cy="-35" r="30" />
          <circle cx="-30" cy="20" r="30" />
          <circle cx="30" cy="20" r="30" />
          <circle cx="0" cy="0" r="16" fill="#990b14" />
          <circle cx="0" cy="0" r="7" fill="#000000" />
          <circle cx="0" cy="-35" r="14" fill="#990b14" />
          <circle cx="-30" cy="20" r="14" fill="#990b14" />
          <circle cx="30" cy="20" r="14" fill="#990b14" />
          <circle cx="0" cy="0" r="38" stroke="#000000" stroke-width="7" fill="none" />
          <circle cx="0" cy="-35" r="24" fill="#990b14" opacity="0.32"/>
          <circle cx="-30" cy="20" r="24" fill="#990b14" opacity="0.32"/>
          <circle cx="30" cy="20" r="24" fill="#990b14" opacity="0.32"/>
        </g>

        <!-- Biển Cảnh Báo Tam Giác Vàng Chấm Than -->
        <g id="warning-triangle">
          <polygon points="0,-185 160,105 -160,105" fill="#000000" stroke="#000000" stroke-width="14" stroke-linejoin="round" />
          <polygon points="0,-175 148,97 -148,97" fill="#fde047" stroke="#000000" stroke-width="8" stroke-linejoin="round" />
          <polygon points="0,-155 130,85 -130,85" fill="none" stroke="#333333" stroke-width="3" stroke-linejoin="round" opacity="0.4" />
          <path d="M-9,-95 L9,-95 L6,15 L-6,15 Z" fill="#000000" />
          <circle cx="0" cy="50" r="11" fill="#000000" />
        </g>
      </defs>

      <!-- Nền sọc Hazard đỏ đen -->
      <rect width="1920" height="1080" fill="url(#hazardStripes)" />
      <rect width="1920" height="1080" fill="rgba(0,0,0,0.18)" />

      <!-- Các biểu tượng Biohazard phân bổ nền trái và phải -->
      <use href="#biohazard-symbol" transform="translate(230, 210) scale(1.6)" />
      <use href="#biohazard-symbol" transform="translate(280, 500) scale(1.7)" />
      <use href="#biohazard-symbol" transform="translate(210, 810) scale(1.6)" />
      <use href="#biohazard-symbol" transform="translate(520, 910) scale(1.6)" />
      <use href="#biohazard-symbol" transform="translate(1690, 230) scale(1.6)" />
      <use href="#biohazard-symbol" transform="translate(1670, 520) scale(1.7)" />
      <use href="#biohazard-symbol" transform="translate(1640, 820) scale(1.6)" />

      <!-- MÁY TÍNH CRT CỔ ĐIỂN Ở TRUNG TÂM -->
      <g transform="translate(960, 520)">
        <!-- Chân đế máy tính -->
        <path d="M-280,410 L280,410 L220,335 L-220,335 Z" fill="#2d2b78" stroke="#100f36" stroke-width="6" />
        <path d="M-220,335 L220,335 L160,250 L-160,250 Z" fill="#353496" stroke="#100f36" stroke-width="5" />
        <rect x="-140" y="210" width="280" height="48" fill="#282672" stroke="#100f36" stroke-width="5" />

        <!-- Vỏ ngoài màn hình CRT xanh tím -->
        <rect x="-500" y="-450" width="1000" height="690" rx="16" fill="#3836a0" stroke="#0e0c3b" stroke-width="12" />
        <g stroke="#262474" stroke-width="4">
          <line x1="-480" y1="-420" x2="480" y2="-420" />
          <line x1="-480" y1="-390" x2="480" y2="-390" />
          <line x1="-480" y1="210" x2="480" y2="210" />
          <line x1="-480" y1="180" x2="480" y2="180" />
        </g>
        <rect x="-420" y="-380" width="840" height="550" rx="8" fill="#1d1b5a" stroke="#090825" stroke-width="8" />

        <!-- Màn hình bên trong màu đỏ cảnh báo -->
        <rect x="-370" y="-330" width="740" height="450" fill="#dc2626" stroke="#ffffff" stroke-width="10" />
        
        <!-- Các vệt quét đen trên nền đỏ -->
        <g stroke="#000000" stroke-width="5" opacity="0.65">
          <line x1="-370" y1="-280" x2="370" y2="-280" />
          <line x1="-370" y1="-220" x2="370" y2="-220" />
          <line x1="-370" y1="-160" x2="370" y2="-160" />
          <line x1="-370" y1="-100" x2="370" y2="-100" />
          <line x1="-370" y1="-40" x2="370" y2="-40" />
          <line x1="-370" y1="20" x2="370" y2="20" />
          <line x1="-370" y1="80" x2="370" y2="80" />
        </g>

        <!-- ĐẦU LÂU XƯƠNG CHÉO (☠) HOÀN CHỈNH NẰM GỌN TRONG MÀN HÌNH -->
        <g id="skull-and-crossbones" transform="translate(0, -115)">
          <!-- Xương chéo góc 1: Tây Bắc - Đông Nam -->
          <g transform="rotate(38)" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round">
            <rect x="-140" y="-14" width="280" height="28" rx="6" />
            <circle cx="-140" cy="-14" r="17" />
            <circle cx="-140" cy="14" r="17" />
            <circle cx="140" cy="-14" r="17" />
            <circle cx="140" cy="14" r="17" />
          </g>

          <!-- Xương chéo góc 2: Đông Bắc - Tây Nam -->
          <g transform="rotate(-38)" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round">
            <rect x="-140" y="-14" width="280" height="28" rx="6" />
            <circle cx="-140" cy="-14" r="17" />
            <circle cx="-140" cy="14" r="17" />
            <circle cx="140" cy="-14" r="17" />
            <circle cx="140" cy="14" r="17" />
          </g>

          <!-- Hộp sọ chính nằm đè lên trên xương chéo -->
          <g fill="#ffffff" stroke="#000000" stroke-width="4">
            <!-- Vòm sọ trên -->
            <ellipse cx="0" cy="-25" rx="92" ry="85" />
            <!-- Phần hàm má dưới -->
            <path d="M -54,-15 L -46,55 Q 0,66 46,55 L 54,-15 Z" />

            <!-- Hốc mắt to đen -->
            <ellipse cx="-34" cy="-24" rx="22" ry="25" fill="#000000" stroke="none" />
            <ellipse cx="34" cy="-24" rx="22" ry="25" fill="#000000" stroke="none" />

            <!-- Hốc mũi hình tam giác đảo -->
            <path d="M-8,14 L8,14 L0,0 Z" fill="#000000" stroke="none" />

            <!-- Hàm răng (4 chiếc răng đều) -->
            <g fill="#ffffff" stroke="#000000" stroke-width="3">
              <rect x="-36" y="32" width="16" height="22" rx="3" />
              <rect x="-18" y="32" width="16" height="22" rx="3" />
              <rect x="2" y="32" width="16" height="22" rx="3" />
              <rect x="20" y="32" width="16" height="22" rx="3" />
            </g>
          </g>
        </g>

        <!-- Thanh progress bar phía dưới nằm trọn trong lòng màn hình đỏ -->
        <rect x="-270" y="40" width="540" height="18" fill="#ffffff" stroke="#000000" stroke-width="3" rx="4" />
      </g>

      <!-- 2 BIỂN CẢNH BÁO TAM GIÁC (THU NHỎ & DẠT SANG HAI CÁNH) -->
      <g id="warning-signs" class="hidden">
        <use href="#warning-triangle" transform="translate(230, 540) scale(1.15)" />
        <use href="#warning-triangle" transform="translate(1690, 540) scale(1.15)" />
      </g>
    </svg>
  </section>

  <!-- ==================== 4. MÀN HÌNH NỀN ĐEN CHỮ ĐỎ ĐẾM LÙI ==================== -->
  <section id="step-countdown" class="hidden absolute inset-0 w-full h-full bg-black flex items-center justify-center">
    <h1 id="countdown-text" class="text-red-600 font-bold text-4xl sm:text-6xl md:text-7xl tracking-wider text-center px-4">
      TỰ HUỶ TRONG 3
    </h1>
  </section>

  <!-- ==================== 5. MÀN HÌNH KẾT THÚC: GIF NỔ TOÀN MÀN HÌNH ==================== -->
  <section id="step-explosion" class="hidden absolute inset-0 w-full h-full bg-black flex items-center justify-center overflow-hidden">
    <!-- Ảnh GIF toàn màn hình -->
    <img 
      id="explosion-gif"
      src="https://i.pinimg.com/originals/48/bc/a3/48bca33b14b5609d2da2552527a513a9.gif" 
      alt="Explosion GIF" 
      class="absolute inset-0 w-full h-full object-cover z-0 pointer-events-none"
    />

    <!-- Chớp sáng trắng khi nổ -->
    <div id="flash-effect" class="absolute inset-0 bg-white pointer-events-none z-10 hidden"></div>
  </section>

  <!-- ==================== 6. MÀN HÌNH ĐEN HOÀN TOÀN (SAU KHI NỔ XONG) ==================== -->
  <section id="step-blackout" class="hidden absolute inset-0 w-full h-full bg-black z-50 pointer-events-none"></section>

  <!-- ==================== LOGIC KỊCH BẢN CHÍNH & HIỆU ỨNG ÂM THANH ==================== -->
  <script>
    const mainBody = document.getElementById('main-body');
    const stepFullscreenPrompt = document.getElementById('step-fullscreen-prompt');
    const stepStart = document.getElementById('step-start');
    const stepLoading = document.getElementById('step-loading');
    const stepGraphic = document.getElementById('step-graphic');
    const stepCountdown = document.getElementById('step-countdown');
    const stepExplosion = document.getElementById('step-explosion');
    const stepBlackout = document.getElementById('step-blackout');

    const btnFullscreen = document.getElementById('btn-fullscreen');
    const btnClick = document.getElementById('btn-click');
    const warningSigns = document.getElementById('warning-signs');
    const countdownText = document.getElementById('countdown-text');
    const explosionGif = document.getElementById('explosion-gif');
    const flashEffect = document.getElementById('flash-effect');

    // ================= CHẶN PHÍM F12, ESC, CTRL+U, DEVTOOLS & CHUỘT PHẢI =================
    // 1. Chặn menu chuột phải
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      return false;
    });

    // 2. Hàm hỗ trợ duy trì toàn màn hình
    async function enforceFullscreen() {
      try {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen().catch(() => {});
          } else if (document.documentElement.webkitRequestFullscreen) {
            await document.documentElement.webkitRequestFullscreen().catch(() => {});
          }
        }
      } catch (_) {}
    }

    // 3. Bắt và triệt tiêu các phím tắt hệ thống
    const blockKeys = (e) => {
      const isCtrlOrMeta = e.ctrlKey || e.metaKey;
      const key = e.key ? e.key.toLowerCase() : '';
      const keyCode = e.keyCode || e.which;

      // Chặn F12
      if (key === 'f12' || keyCode === 123) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }

      // Chặn Ctrl+U (Xem nguồn trang)
      if (isCtrlOrMeta && (key === 'u' || keyCode === 85)) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }

      // Chặn Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C (Mở Inspect / Console)
      if (isCtrlOrMeta && e.shiftKey && (key === 'i' || key === 'j' || key === 'c' || keyCode === 73 || keyCode === 74 || keyCode === 67)) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }

      // Chặn phím Escape (Esc)
      if (key === 'escape' || keyCode === 27) {
        e.preventDefault();
        e.stopPropagation();
        enforceFullscreen();
        return false;
      }

      // Chặn Ctrl+S (Lưu trang)
      if (isCtrlOrMeta && (key === 's' || keyCode === 83)) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
    };

    window.addEventListener('keydown', blockKeys, true);
    window.addEventListener('keyup', blockKeys, true);

    // Khi người dùng bấm thoát toàn màn hình, lập tức kích hoạt lại nếu có tương tác
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && stepFullscreenPrompt.classList.contains('hidden')) {
        setTimeout(enforceFullscreen, 100);
      }
    });

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // Bộ xử lý Web Audio API
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // 1. Tiếng còi cảnh báo Avast
    function playAvastAlarm() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const freqs = [880, 660, 880, 660];
        freqs.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now + idx * 0.14);
          gain.gain.setValueAtTime(0.2, now + idx * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.12);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.14);
          osc.stop(now + idx * 0.14 + 0.13);
        });
      } catch (e) {
        console.warn('Audio alarm error:', e);
      }
    }

    // 2. Giọng đọc "Caution: A virus has been detected!" đặc trưng của Avast
    function playAvastVoice() {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance("Caution! A virus has been detected!");
          utterance.lang = 'en-US';
          utterance.rate = 0.95;
          utterance.pitch = 1.05;
          window.speechSynthesis.speak(utterance);
        }
      } catch (e) {
        console.warn('Speech error:', e);
      }
    }

    // 3. Âm thanh tiếng bíp đếm ngược
    function playBeep(freq = 600, duration = 0.15) {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    // 4. SFX tiếng nổ trầm và rền (Explosion Synth)
    function playExplosionSFX() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        // Sub-bass rumble tiếng nổ
        const osc = ctx.createOscillator();
        const oscGain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(25, now + 1.2);
        oscGain.gain.setValueAtTime(0.85, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 1.3);
        osc.connect(oscGain);
        oscGain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 1.3);

        // White noise tạo tiếng nổ xé rách
        const bufferSize = ctx.sampleRate * 1.2;
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(950, now);
        filter.frequency.exponentialRampToValueAtTime(60, now + 1.2);

        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.7, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

        whiteNoise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(ctx.destination);

        whiteNoise.start(now);
        whiteNoise.stop(now + 1.2);
      } catch (e) {
        console.warn('Explosion audio error:', e);
      }
    }

    // Bước 0: Yêu cầu bật toàn màn hình (chống lỗi crash khi chạy trong iframe)
    btnFullscreen.addEventListener('click', async () => {
      getAudioContext();
      try {
        if (!document.fullscreenElement) {
          if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen().catch(() => {});
          } else if (document.documentElement.webkitRequestFullscreen) {
            await document.documentElement.webkitRequestFullscreen().catch(() => {});
          } else if (document.documentElement.msRequestFullscreen) {
            await document.documentElement.msRequestFullscreen().catch(() => {});
          }
        }
      } catch (err) {
        console.warn('Fullscreen ignored/blocked in iframe:', err);
      }

      // Luôn chuyển màn hình thành công
      stepFullscreenPrompt.classList.add('hidden');
      stepStart.classList.remove('hidden');
      stepStart.classList.add('flex');
    });

    // Bắt đầu chuỗi kịch bản khi nhấn nút "Bấm vào đây"
    btnClick.addEventListener('click', async () => {
      getAudioContext();

      // 1. Chuyển sang màn hình Loading trong đúng 3 giây
      stepStart.classList.add('hidden');
      stepStart.classList.remove('flex');
      stepLoading.classList.remove('hidden');
      stepLoading.classList.add('flex');

      await sleep(3000);

      // 2. Hiện màn hình đồ họa máy tính và cảnh báo
      stepLoading.classList.add('hidden');
      stepLoading.classList.remove('flex');
      stepGraphic.classList.remove('hidden');

      let hasWarning = false;
      warningSigns.classList.add('hidden');

      // Chuyển đổi nhịp cảnh báo 5 lần
      for (let i = 0; i < 5; i++) {
        await sleep(1000);
        hasWarning = !hasWarning;
        if (hasWarning) {
          warningSigns.classList.remove('hidden');
          // Phát còi báo động Avast ở lần nhấp nháy tam giác
          playAvastAlarm();
          if (i === 1) {
            playAvastVoice(); // Giọng đọc Avast
          }
        } else {
          warningSigns.classList.add('hidden');
        }
      }

      await sleep(1000);
      stepGraphic.classList.add('hidden');

      // 3. Nền đen hoàn toàn, chữ đỏ "TỰ HUỶ TRONG 3" -> 2 -> 1
      stepCountdown.classList.remove('hidden');
      stepCountdown.classList.add('flex');

      countdownText.textContent = "TỰ HUỶ TRONG 3";
      playBeep(450, 0.2);
      await sleep(1000);

      countdownText.textContent = "TỰ HUỶ TRONG 2";
      playBeep(450, 0.2);
      await sleep(1000);

      countdownText.textContent = "TỰ HUỶ TRONG 1";
      playBeep(750, 0.35);
      await sleep(1000);

      // 4. Màn hình nổ GIF + Rung giật màn hình + SFX vụ nổ
      stepCountdown.classList.add('hidden');
      stepCountdown.classList.remove('flex');

      const baseGifUrl = "https://i.pinimg.com/originals/48/bc/a3/48bca33b14b5609d2da2552527a513a9.gif";
      explosionGif.src = baseGifUrl + "?t=" + Date.now();

      stepExplosion.classList.remove('hidden');
      stepExplosion.classList.add('flex');

      // Kích hoạt âm thanh vụ nổ
      playExplosionSFX();

      // Kích hoạt rung giật màn hình
      mainBody.classList.add('shaking');

      // Chớp sáng nổ
      flashEffect.classList.remove('hidden');
      flashEffect.classList.add('flash-overlay');

      setTimeout(() => {
        flashEffect.classList.add('hidden');
        flashEffect.classList.remove('flash-overlay');
      }, 400);

      // 5. Kết thúc GIF nổ sau 1.3s và chuyển sang màn hình đen hoàn toàn
      await sleep(1300);
      mainBody.classList.remove('shaking');
      explosionGif.src = ""; // Ngắt GIF
      stepExplosion.classList.add('hidden');
      stepExplosion.classList.remove('flex');

      stepBlackout.classList.remove('hidden');
      document.body.style.backgroundColor = '#000000';
    }, { once: true });
  </script>
</body>
</html>
