<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cảnh Báo Tự Hủy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Font mặc định đồng bộ Arial, vô hiệu hóa chọn văn bản */
    body, * {
      font-family: Arial, Helvetica, sans-serif !important;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Hiệu ứng quét dòng CRT cổ điển */
    .crt-scanlines {
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0) 50%,
        rgba(0, 0, 0, 0.4) 50%,
        rgba(0, 0, 0, 0.4)
      );
      background-size: 100% 4px;
      pointer-events: none;
    }

    /* Flash chớp sáng hạt nhân cực mạnh */
    @keyframes nuclear-flash {
      0% { opacity: 1; background: #ffffff; }
      15% { opacity: 0.95; background: #fff5e6; }
      40% { opacity: 0.6; background: #ffaa44; }
      100% { opacity: 0; background: transparent; }
    }

    .nuclear-flash-anim {
      animation: nuclear-flash 1.2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }

    /* Rung chấn màn hình khi sóng xung kích (Shockwave) ập tới */
    @keyframes screen-shake {
      0% { transform: translate(0, 0) scale(1.05); }
      10% { transform: translate(-14px, 10px) scale(1.08); }
      20% { transform: translate(12px, -12px) scale(1.06); }
      30% { transform: translate(-10px, 8px) scale(1.07); }
      40% { transform: translate(8px, -6px) scale(1.05); }
      60% { transform: translate(-4px, 4px) scale(1.03); }
      80% { transform: translate(3px, -2px) scale(1.01); }
      100% { transform: translate(0, 0) scale(1); }
    }

    .shockwave-shake {
      animation: screen-shake 2.8s ease-out;
    }

    /* Trạng thái tắt ngấm màn hình và ẩn hoàn toàn con trỏ chuột */
    .hidden-cursor {
      cursor: none !important;
    }
  </style>
</head>
<body class="w-screen h-screen m-0 p-0 bg-white flex items-center justify-center overflow-hidden transition-colors duration-200">

  <!-- ==================== BƯỚC 1: BẬT TOÀN MÀN HÌNH ==================== -->
  <section id="screen-fullscreen" class="flex flex-col items-center justify-center w-full h-full text-center px-4">
    <button 
      id="btn-fullscreen" 
      class="px-6 py-2.5 bg-gray-900 hover:bg-black active:bg-gray-800 text-white text-base font-normal rounded cursor-pointer transition-colors shadow-sm outline-none border-none"
    >
      Bật toàn màn hình
    </button>
  </section>

  <!-- ==================== BƯỚC 2: NÚT TỐI GIẢN "BẤM VÀO ĐÂY" ==================== -->
  <section id="screen-trigger" class="hidden flex items-center justify-center w-full h-full">
    <button 
      id="btn-trigger" 
      class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-base font-normal rounded cursor-pointer transition-colors shadow-sm outline-none border-none"
    >
      Bấm vào đây
    </button>
  </section>

  <!-- ==================== BƯỚC 3: LOADING TRONG 3 GIÂY ==================== -->
  <section id="screen-loading" class="hidden flex flex-col items-center justify-center gap-3">
    <div class="w-12 h-12 border-4 border-gray-200 border-t-blue-600 rounded-full animate-spin"></div>
    <span class="text-sm text-gray-500 font-normal">Đang tải...</span>
  </section>

  <!-- ==================== BƯỚC 4: ĐỒ HỌA MÀN HÌNH CRT NGUY HIỂM ==================== -->
  <section id="screen-graphics" class="hidden absolute inset-0 w-full h-full bg-black flex items-center justify-center overflow-hidden">
    <div class="crt-scanlines absolute inset-0 z-20"></div>

    <svg id="svg-display" viewBox="0 0 1920 1080" class="w-full h-full max-w-full max-h-full object-contain" preserveAspectRatio="xMidYMid slice">
      <defs>
        <pattern id="hazardStripes" width="160" height="160" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="0" y2="160" stroke="#990b14" stroke-width="80" />
          <line x1="80" y1="0" x2="80" y2="160" stroke="#0f0506" stroke-width="80" />
        </pattern>

        <g id="biohazard-symbol" fill="#000000" fill-opacity="0.82">
          <circle cx="0" cy="-35" r="30" />
          <circle cx="-30" cy="20" r="30" />
          <circle cx="30" cy="20" r="30" />
          <circle cx="0" cy="0" r="16" fill="#990b14" />
          <circle cx="0" cy="0" r="7" fill="#000000" />
          <circle cx="0" cy="-35" r="14" fill="#990b14" />
          <circle cx="-30" cy="20" r="14" fill="#990b14" />
          <circle cx="30" cy="20" r="14" fill="#990b14" />
          <circle cx="0" cy="0" r="38" stroke="#000000" stroke-width="7" fill="none" />
          <circle cx="0" cy="-35" r="24" fill="#990b14" opacity="0.32"/>
          <circle cx="-30" cy="20" r="24" fill="#990b14" opacity="0.32"/>
          <circle cx="30" cy="20" r="24" fill="#990b14" opacity="0.32"/>
        </g>

        <g id="warning-triangle">
          <polygon points="0,-185 160,105 -160,105" fill="#000000" stroke="#000000" stroke-width="14" stroke-linejoin="round" />
          <polygon points="0,-175 148,97 -148,97" fill="#fde047" stroke="#000000" stroke-width="8" stroke-linejoin="round" />
          <polygon points="0,-155 130,85 -130,85" fill="none" stroke="#333333" stroke-width="3" stroke-linejoin="round" opacity="0.35" />
          <path d="M-9,-95 L9,-95 L6,15 L-6,15 Z" fill="#000000" />
          <circle cx="0" cy="50" r="11" fill="#000000" />
        </g>
      </defs>

      <rect width="1920" height="1080" fill="url(#hazardStripes)" />
      <rect width="1920" height="1080" fill="rgba(0,0,0,0.2)" />

      <use href="#biohazard-symbol" transform="translate(230, 210) scale(1.6)" />
      <use href="#biohazard-symbol" transform="translate(280, 500) scale(1.7)" />
      <use href="#biohazard-symbol" transform="translate(210, 810) scale(1.6)" />
      <use href="#biohazard-symbol" transform="translate(520, 910) scale(1.6)" />
      <use href="#biohazard-symbol" transform="translate(1690, 230) scale(1.6)" />
      <use href="#biohazard-symbol" transform="translate(1670, 520) scale(1.7)" />
      <use href="#biohazard-symbol" transform="translate(1640, 820) scale(1.6)" />

      <!-- MÀN HÌNH MÁY TÍNH TRUNG TÂM -->
      <g transform="translate(960, 540)">
        <path d="M-280,410 L280,410 L220,335 L-220,335 Z" fill="#2d2b78" stroke="#100f36" stroke-width="6" />
        <path d="M-220,335 L220,335 L160,250 L-160,250 Z" fill="#353496" stroke="#100f36" stroke-width="5" />
        <rect x="-140" y="210" width="280" height="48" fill="#282672" stroke="#100f36" stroke-width="5" />

        <rect x="-500" y="-450" width="1000" height="690" rx="16" fill="#3836a0" stroke="#0e0c3b" stroke-width="12" />
        <g stroke="#262474" stroke-width="4">
          <line x1="-480" y1="-420" x2="480" y2="-420" />
          <line x1="-480" y1="-390" x2="480" y2="-390" />
          <line x1="-480" y1="210" x2="480" y2="210" />
          <line x1="-480" y1="180" x2="480" y2="180" />
        </g>
        <rect x="-420" y="-380" width="840" height="550" rx="8" fill="#1d1b5a" stroke="#090825" stroke-width="8" />

        <rect x="-370" y="-330" width="740" height="450" fill="#dc2626" stroke="#ffffff" stroke-width="10" />
        
        <g stroke="#000000" stroke-width="5" opacity="0.65">
          <line x1="-370" y1="-280" x2="370" y2="-280" />
          <line x1="-370" y1="-220" x2="370" y2="-220" />
          <line x1="-370" y1="-160" x2="370" y2="-160" />
          <line x1="-370" y1="-100" x2="370" y2="-100" />
          <line x1="-370" y1="-40" x2="370" y2="-40" />
          <line x1="-370" y1="20" x2="370" y2="20" />
          <line x1="-370" y1="80" x2="370" y2="80" />
        </g>

        <!-- ĐẦU LÂU RETRO -->
        <g fill="#ffffff" stroke="#000000" stroke-width="3">
          <circle cx="-135" cy="-95" r="16" /><circle cx="-100" cy="-125" r="16" />
          <circle cx="135" cy="95" r="16" /><circle cx="100" cy="125" r="16" />
          <rect x="-115" y="-105" width="230" height="28" transform="rotate(35)" rx="6" />

          <circle cx="135" cy="-95" r="16" /><circle cx="100" cy="-125" r="16" />
          <circle cx="-135" cy="95" r="16" /><circle cx="-100" cy="125" r="16" />
          <rect x="-115" y="-105" width="230" height="28" transform="rotate(-35)" rx="6" />

          <ellipse cx="0" cy="-80" rx="90" ry="85" />
          <rect x="-55" y="-20" width="110" height="65" rx="14" />
          
          <ellipse cx="-35" cy="-80" rx="22" ry="24" fill="#000000" stroke="none" />
          <ellipse cx="35" cy="-80" rx="22" ry="24" fill="#000000" stroke="none" />
          <path d="M-8,-45 L8,-45 L0,-62 Z" fill="#000000" stroke="none" />

          <g fill="#ffffff" stroke="#000000" stroke-width="3">
            <rect x="-40" y="10" width="16" height="22" rx="3" />
            <rect x="-20" y="10" width="16" height="22" rx="3" />
            <rect x="4" y="10" width="16" height="22" rx="3" />
            <rect x="24" y="10" width="16" height="22" rx="3" />
          </g>
        </g>

        <rect x="-280" y="70" width="560" height="18" fill="#ffffff" stroke="#000000" stroke-width="2" />
      </g>

      <!-- 2 BIỂN CẢNH BÁO TAM GIÁC VÀNG -->
      <g id="warning-layer" class="hidden">
        <use href="#warning-triangle" transform="translate(230, 540) scale(1.15)" />
        <use href="#warning-triangle" transform="translate(1690, 540) scale(1.15)" />
      </g>
    </svg>
  </section>

  <!-- ==================== BƯỚC 5: NỀN ĐEN CHỮ ĐỎ ĐẾM NGƯỢC ==================== -->
  <section id="screen-countdown" class="hidden absolute inset-0 w-full h-full bg-black flex items-center justify-center">
    <h1 id="countdown-text" class="text-red-600 font-bold text-4xl sm:text-6xl md:text-7xl tracking-wider text-center px-4">
      TỰ HUỶ TRONG 3
    </h1>
  </section>

  <!-- ==================== BƯỚC 6: ATOMIC EXPLOSION MEME TOÀN MÀN HÌNH ==================== -->
  <section id="screen-explosion" class="hidden absolute inset-0 w-full h-full bg-black flex items-center justify-center overflow-hidden">
    <!-- Container chứa video/ảnh nổ hạt nhân để rung chấn (shockwave shake) -->
    <div id="explosion-wrapper" class="relative w-full h-full flex items-center justify-center overflow-hidden">
      <!-- Video Atomic Explosion Meme Plantilla (YouTube 7LD-WsfQsv0) -->
      <iframe 
        id="atomic-video"
        class="absolute w-[120vw] h-[120vh] max-w-none pointer-events-none scale-110 object-cover"
        src=""
        title="Atomic Explosion"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
      ></iframe>

      <!-- Hình ảnh dự phòng Shockwave Explosion nếu video chưa kịp stream -->
      <img 
        id="explosion-fallback" 
        src="https://i.pinimg.com/originals/48/bc/a3/48bca33b14b5609d2da2552527a513a9.gif"
        alt="Atomic Shockwave"
        class="absolute inset-0 w-full h-full object-cover z-0 pointer-events-none opacity-90 mix-blend-screen"
      />
    </div>

    <!-- Chớp sáng trắng xóa toàn màn hình lúc bom phát nổ -->
    <div id="flash-effect" class="absolute inset-0 bg-white pointer-events-none z-30 hidden"></div>
  </section>

  <!-- ==================== BƯỚC 7: MÀN HÌNH ĐEN HOÀN TOÀN VĨNH VIỄN ==================== -->
  <section id="screen-blackout" class="hidden absolute inset-0 w-full h-full bg-black z-50 hidden-cursor"></section>

  <!-- ==================== KỊCH BẢN ĐIỀU KHIỂN ==================== -->
  <script>
    const screenFullscreen = document.getElementById('screen-fullscreen');
    const screenTrigger = document.getElementById('screen-trigger');
    const screenLoading = document.getElementById('screen-loading');
    const screenGraphics = document.getElementById('screen-graphics');
    const screenCountdown = document.getElementById('screen-countdown');
    const screenExplosion = document.getElementById('screen-explosion');
    const screenBlackout = document.getElementById('screen-blackout');

    const btnFullscreen = document.getElementById('btn-fullscreen');
    const btnTrigger = document.getElementById('btn-trigger');
    const warningLayer = document.getElementById('warning-layer');
    const countdownText = document.getElementById('countdown-text');
    const atomicVideo = document.getElementById('atomic-video');
    const explosionWrapper = document.getElementById('explosion-wrapper');
    const flashEffect = document.getElementById('flash-effect');

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    let audioCtx = null;
    let sirenInterval = null;
    let isSirenActive = false;

    // Âm thanh giọng nói Avast 4.8 chính thức
    const avastAudioUrl = 'https://www.myinstants.com/media/sounds/avast-4-8-caution-a-virus-has-been-detected.mp3';
    const avastAudio = new Audio(avastAudioUrl);
    avastAudio.loop = true;
    avastAudio.preload = 'auto';

    // Âm thanh nuke nổ meme từ MyInstants
    const nukeAudioUrl = 'https://www.myinstants.com/media/sounds/nuke-bomb.mp3';
    const nukeAudio = new Audio(nukeAudioUrl);
    nukeAudio.preload = 'auto';

    function ensureAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Tiếng đếm ngược BEEP
    function playCountdownBeep(freq = 880, duration = 0.15) {
      try {
        const ctx = ensureAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);

        gain.gain.setValueAtTime(0.35, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        console.warn('Beep error:', e);
      }
    }

    // =========================================================================
    // SFX VỤ NỔ NGUYÊN TỬ (ATOMIC EXPLOSION & SHOCKWAVE BLAST MEME)
    // Mô phỏng chính xác video meme 7LD-WsfQsv0:
    // 1. Cú nổ kích nổ ban đầu (Initial Detonation Blast) cực mạnh, đinh tai
    // 2. Tiếng gầm rú của sóng xung kích (Deafening Shockwave & Roaring Wind)
    // 3. Sub-bass rung rền ở tần số cực thấp (25Hz) tạo độ rung
    // =========================================================================
    function triggerAtomicShockwaveSFX() {
      // Phát audio meme nuke nếu sẵn sàng
      try {
        nukeAudio.currentTime = 0;
        nukeAudio.volume = 1.0;
        nukeAudio.play().catch(() => {});
      } catch (e) {}

      // Bộ tổng hợp Web Audio API (Chạy độc lập, không phụ thuộc kết nối mạng)
      try {
        const ctx = ensureAudioContext();
        const now = ctx.currentTime;
        const totalDuration = 3.6;

        // 1. TẠO TIẾNG GIÓ GẦM CỦA SÓNG XUNG KÍCH (Brownian / Lowpass Wind Shockwave)
        const bufferSize = ctx.sampleRate * totalDuration;
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        let lastOut = 0.0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          // Lọc kiểu Brown noise cho tiếng gầm dày
          data[i] = (lastOut + (0.02 * white)) / 1.02;
          lastOut = data[i];
          data[i] *= 3.8;
        }

        const noiseSrc = ctx.createBufferSource();
        noiseSrc.buffer = noiseBuffer;

        // Bộ lọc tần số quét (Filter Sweep) tạo cảm giác luồng hơi ép tới
        const sweepFilter = ctx.createBiquadFilter();
        sweepFilter.type = 'lowpass';
        sweepFilter.frequency.setValueAtTime(1400, now);
        sweepFilter.frequency.exponentialRampToValueAtTime(180, now + 1.4);
        sweepFilter.frequency.exponentialRampToValueAtTime(40, now + totalDuration);

        const noiseGain = ctx.createGain();
        // Nổ bùng lên ngay lập tức rồi giữ độ rền của sóng xung kích
        noiseGain.gain.setValueAtTime(0.1, now);
        noiseGain.gain.linearRampToValueAtTime(1.0, now + 0.04);
        noiseGain.gain.exponentialRampToValueAtTime(0.7, now + 1.2);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + totalDuration);

        noiseSrc.connect(sweepFilter);
        sweepFilter.connect(noiseGain);
        noiseGain.connect(ctx.destination);
        noiseSrc.start(now);
        noiseSrc.stop(now + totalDuration);

        // 2. SUB-BASS DETONATION BOOM (Xung kích siêu trầm)
        const subOsc = ctx.createOscillator();
        const subGain = ctx.createGain();

        subOsc.type = 'sine';
        subOsc.frequency.setValueAtTime(120, now);
        subOsc.frequency.exponentialRampToValueAtTime(25, now + 1.8);

        subGain.gain.setValueAtTime(1.0, now);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);

        subOsc.connect(subGain);
        subGain.connect(ctx.destination);
        subOsc.start(now);
        subOsc.stop(now + 2.5);

        // 3. TIẾNG ĐANH GẮNG CỰC ĐẠI (Distorted Blast Impact)
        const clickOsc = ctx.createOscillator();
        const clickGain = ctx.createGain();
        clickOsc.type = 'sawtooth';
        clickOsc.frequency.setValueAtTime(280, now);
        clickOsc.frequency.exponentialRampToValueAtTime(50, now + 0.25);

        clickGain.gain.setValueAtTime(0.8, now);
        clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        clickOsc.connect(clickGain);
        clickGain.connect(ctx.destination);
        clickOsc.start(now);
        clickOsc.stop(now + 0.25);

      } catch (e) {
        console.warn('Atomic SFX synthesis failed:', e);
      }
    }

    // Còi hú Avast 4.8 Wee-Woo
    function startAvastSirenLoop() {
      if (isSirenActive) return;
      isSirenActive = true;

      try {
        const ctx = ensureAudioContext();
        let toneHigh = true;
        const playTone = () => {
          if (!isSirenActive || !audioCtx) return;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(toneHigh ? 960 : 770, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start();
          osc.stop(audioCtx.currentTime + 0.18);
          toneHigh = !toneHigh;
        };

        playTone();
        sirenInterval = setInterval(playTone, 190);
      } catch (e) {
        console.warn('AudioContext siren failed:', e);
      }

      avastAudio.currentTime = 0;
      avastAudio.play().catch(() => {
        speakFallbackLoop();
      });
    }

    function speakFallbackLoop() {
      if (!isSirenActive || !('speechSynthesis' in window)) return;
      const speak = () => {
        if (!isSirenActive) return;
        const utterance = new SpeechSynthesisUtterance("Caution! A virus has been detected!");
        utterance.lang = 'en-US';
        utterance.pitch = 1.15;
        utterance.rate = 1.0;
        utterance.onend = () => {
          if (isSirenActive) setTimeout(speak, 500);
        };
        window.speechSynthesis.speak(utterance);
      };
      speak();
    }

    function stopAllAlertSounds() {
      isSirenActive = false;
      if (sirenInterval) {
        clearInterval(sirenInterval);
        sirenInterval = null;
      }
      try {
        avastAudio.pause();
        avastAudio.currentTime = 0;
      } catch (e) {}

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    // BƯỚC 1: Bật toàn màn hình
    btnFullscreen.addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) {
          if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
          } else if (document.documentElement.webkitRequestFullscreen) {
            await document.documentElement.webkitRequestFullscreen();
          } else if (document.documentElement.msRequestFullscreen) {
            await document.documentElement.msRequestFullscreen();
          }
        }
      } catch (err) {
        console.warn('Fullscreen request failed:', err);
      }

      ensureAudioContext();
      try {
        avastAudio.load();
        nukeAudio.load();
      } catch (e) {}

      screenFullscreen.classList.add('hidden');
      screenFullscreen.classList.remove('flex');
      screenTrigger.classList.remove('hidden');
      screenTrigger.classList.add('flex');
    }, { once: true });

    // BƯỚC 2 -> 7: Kịch bản chính
    btnTrigger.addEventListener('click', async () => {
      // 1. Loading 3 giây
      screenTrigger.classList.add('hidden');
      screenTrigger.classList.remove('flex');
      screenLoading.classList.remove('hidden');
      screenLoading.classList.add('flex');

      await sleep(3000);

      // 2. Màn hình Virus chuyển đổi 5 lần (1s mỗi lần)
      screenLoading.classList.add('hidden');
      screenLoading.classList.remove('flex');
      screenGraphics.classList.remove('hidden');

      let warningActive = false;
      warningLayer.classList.add('hidden');

      for (let i = 0; i < 5; i++) {
        await sleep(1000);
        warningActive = !warningActive;

        if (warningActive) {
          warningLayer.classList.remove('hidden');
          startAvastSirenLoop();
        } else {
          warningLayer.classList.add('hidden');
        }
      }

      await sleep(1000);

      // 3. Dừng còi hú, chuyển sang màn hình chữ đỏ đếm ngược
      stopAllAlertSounds();
      screenGraphics.classList.add('hidden');

      screenCountdown.classList.remove('hidden');
      screenCountdown.classList.add('flex');

      countdownText.textContent = "TỰ HUỶ TRONG 3";
      playCountdownBeep(750, 0.2);
      await sleep(1000);

      countdownText.textContent = "TỰ HUỶ TRONG 2";
      playCountdownBeep(750, 0.2);
      await sleep(1000);

      countdownText.textContent = "TỰ HUỶ TRONG 1";
      playCountdownBeep(1050, 0.35);
      await sleep(1000);

      // 4. BÙNG NỔ ATOMIC EXPLOSION SHOCKWAVE (YouTube 7LD-WsfQsv0)
      screenCountdown.classList.add('hidden');
      screenCountdown.classList.remove('flex');

      // Kích hoạt video meme hạt nhân (tắt controls, autoplay, bắt đầu ngay khoảnh khắc phát nổ)
      atomicVideo.src = "https://www.youtube-nocookie.com/embed/7LD-WsfQsv0?autoplay=1&controls=0&mute=0&modestbranding=1&rel=0&start=0";

      screenExplosion.classList.remove('hidden');
      screenExplosion.classList.add('flex');

      // Kích hoạt hiệu ứng âm thanh tiếng nổ nấm nguyên tử + sóng xung kích cuồng phong
      triggerAtomicShockwaveSFX();

      // Hiệu ứng chớp sáng hạt nhân và rung chấn màn hình
      flashEffect.classList.remove('hidden');
      flashEffect.classList.add('nuclear-flash-anim');
      explosionWrapper.classList.add('shockwave-shake');

      // Thời lượng sóng xung kích của quả bom nổ quét qua (khoảng 3.5 giây đúng theo meme)
      await sleep(3500);

      // 5. CẮT ĐỘT NGỘT: Tắt tiếng, ngắt video và đen ngòm màn hình vĩnh viễn
      atomicVideo.src = "";
      try {
        nukeAudio.pause();
        nukeAudio.currentTime = 0;
      } catch (e) {}

      screenExplosion.classList.add('hidden');
      screenExplosion.classList.remove('flex');

      screenBlackout.classList.remove('hidden');
      document.body.style.backgroundColor = '#000000';
      document.body.classList.add('hidden-cursor');
    }, { once: true });
  </script>
</body>
