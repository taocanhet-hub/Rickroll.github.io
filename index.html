<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Diagnostic</title>
  <style>
    /* Kiểu chữ mặc định Arial, chặn chọn văn bản */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: Arial, Helvetica, sans-serif !important;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .screen {
      display: none;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .screen.active {
      display: flex;
    }

    /* Nút bấm phẳng đơn giản theo font Arial */
    .simple-btn {
      padding: 12px 28px;
      font-size: 16px;
      background-color: #f0f0f0;
      color: #111111;
      border: 1px solid #767676;
      border-radius: 3px;
      cursor: pointer;
      outline: none;
    }

    .simple-btn:hover {
      background-color: #e5e5e5;
    }

    .simple-btn:active {
      background-color: #cccccc;
    }

    /* Spinner xoay tròn màu xanh dương cơ bản */
    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid #e0e0e0;
      border-top: 4px solid #0066cc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Màn hình virus */
    #step-virus {
      background-color: #000000;
    }

    .virus-svg-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .virus-svg-container svg {
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    /* Đếm ngược tự huỷ chữ đỏ */
    #step-countdown {
      background-color: #000000;
    }

    .countdown-text {
      color: #ff0000;
      font-weight: bold;
      font-size: clamp(32px, 6vw, 76px);
      letter-spacing: 4px;
      text-align: center;
    }

    /* Màn hình nổ nguyên tử */
    #step-explosion {
      background-color: #000000;
      position: relative;
      overflow: hidden;
    }

    .explosion-gif {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Chớp sáng trắng bom hạt nhân */
    .nuclear-flash {
      position: absolute;
      inset: 0;
      background: #ffffff;
      z-index: 10;
      animation: flash-fade 0.6s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
      pointer-events: none;
    }

    @keyframes flash-fade {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Rung lắc màn hình mô phỏng sóng xung kích */
    .shake-anim {
      animation: screen-shake 1.3s ease-out;
    }

    @keyframes screen-shake {
      0% { transform: translate(0, 0) scale(1.04); }
      15% { transform: translate(-14px, 12px) scale(1.07); }
      30% { transform: translate(12px, -10px) scale(1.05); }
      45% { transform: translate(-10px, 8px) scale(1.06); }
      60% { transform: translate(8px, -6px) scale(1.03); }
      80% { transform: translate(-4px, 4px) scale(1.01); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* Màn hình đen hoàn toàn vĩnh viễn */
    #step-blackout {
      background-color: #000000;
      cursor: none;
    }
  </style>
</head>
<body>

  <!-- BƯỚC 0: BẬT TOÀN MÀN HÌNH & KHỞI TẠO AUDIO -->
  <div id="step-fs-request" class="screen active">
    <button id="btn-fs" class="simple-btn">Bật toàn màn hình</button>
  </div>

  <!-- BƯỚC 1: NÚT BẤM TỐI GIẢN -->
  <div id="step-trigger" class="screen">
    <button id="btn-trigger" class="simple-btn">Bấm vào đây</button>
  </div>

  <!-- BƯỚC 2: VÒNG XOAY TẢI 3 GIÂY -->
  <div id="step-loading" class="screen">
    <div class="spinner"></div>
  </div>

  <!-- BƯỚC 3: ĐỒ HỌA MÁY TÍNH RETRO VIRUS -->
  <div id="step-virus" class="screen">
    <div class="virus-svg-container">
      <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Sọc cảnh báo đỏ đen -->
          <pattern id="stripes" width="160" height="160" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="0" y2="160" stroke="#000000" stroke-width="80" />
            <line x1="80" y1="0" x2="80" y2="160" stroke="#b30000" stroke-width="80" />
          </pattern>

          <!-- Dòng quét CRT -->
          <pattern id="scanlines" width="100%" height="8" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="1920" y2="0" stroke="#000000" stroke-width="4" stroke-opacity="0.45" />
          </pattern>

          <!-- Biểu tượng Biohazard -->
          <g id="biohazard">
            <circle cx="0" cy="0" r="160" fill="none" stroke="#000000" stroke-width="26" opacity="0.85" />
            <circle cx="0" cy="-60" r="75" fill="none" stroke="#000000" stroke-width="24" opacity="0.85" />
            <circle cx="-52" cy="30" r="75" fill="none" stroke="#000000" stroke-width="24" opacity="0.85" />
            <circle cx="52" cy="30" r="75" fill="none" stroke="#000000" stroke-width="24" opacity="0.85" />
            <circle cx="0" cy="0" r="28" fill="#000000" opacity="0.85" />
          </g>

          <!-- Biển cảnh báo tam giác vàng (!) gọn gàng -->
          <g id="warning-triangle">
            <polygon points="0,-160 145,110 -145,110" fill="#ffff00" stroke="#000000" stroke-width="22" stroke-linejoin="round"/>
            <polygon points="0,-140 125,95 -125,95" fill="#ffd700" opacity="0.3"/>
            <rect x="-14" y="-70" width="28" height="90" rx="8" fill="#000000"/>
            <circle cx="0" cy="58" r="15" fill="#000000"/>
          </g>
        </defs>

        <!-- Nền sọc -->
        <rect width="1920" height="1080" fill="url(#stripes)" />

        <!-- Biểu tượng Biohazard xung quanh -->
        <g transform="translate(190, 190) scale(0.9)"><use href="#biohazard"/></g>
        <g transform="translate(1680, 200) scale(0.9)"><use href="#biohazard"/></g>
        <g transform="translate(230, 500) scale(0.85)"><use href="#biohazard"/></g>
        <g transform="translate(1690, 490) scale(0.85)"><use href="#biohazard"/></g>
        <g transform="translate(170, 830) scale(0.95)"><use href="#biohazard"/></g>
        <g transform="translate(1680, 840) scale(0.95)"><use href="#biohazard"/></g>
        <g transform="translate(520, 930) scale(0.75)"><use href="#biohazard"/></g>

        <!-- Khối máy tính trung tâm -->
        <g id="crt-monitor">
          <polygon points="700,940 1220,940 1270,980 650,980" fill="#2d2b94" stroke="#000" stroke-width="7"/>
          <rect x="800" y="780" width="320" height="160" fill="#25247c" stroke="#000" stroke-width="7"/>
          <rect x="750" y="870" width="420" height="30" fill="#3534b0" stroke="#000" stroke-width="6"/>

          <rect x="460" y="90" width="1000" height="700" rx="20" fill="#2d2b94" stroke="#000" stroke-width="12" />
          <rect x="475" y="105" width="970" height="670" rx="14" fill="#3836b8" />
          <rect x="520" y="140" width="880" height="600" fill="#1b1a64" stroke="#000" stroke-width="8" />

          <rect x="620" y="180" width="680" height="460" fill="#cc1111" stroke="#ffffff" stroke-width="6" />
          <rect x="645" y="205" width="630" height="410" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8" />

          <!-- Đầu lâu retro pixel -->
          <g transform="translate(960, 390)">
            <line x1="-120" y1="-85" x2="120" y2="85" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
            <line x1="-120" y1="85" x2="120" y2="-85" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
            <circle cx="-120" cy="-85" r="18" fill="#ffffff" /><circle cx="120" cy="85" r="18" fill="#ffffff" />
            <circle cx="-120" cy="85" r="18" fill="#ffffff" /><circle cx="120" cy="-85" r="18" fill="#ffffff" />

            <rect x="-80" y="-120" width="160" height="145" rx="55" fill="#ffffff" />
            <rect x="-55" y="0" width="110" height="60" rx="12" fill="#ffffff" />

            <ellipse cx="-35" cy="-45" rx="18" ry="24" fill="#cc1111" />
            <ellipse cx="35" cy="-45" rx="18" ry="24" fill="#cc1111" />
            <polygon points="0,-18 -12,5 12,5" fill="#cc1111" />

            <rect x="-42" y="22" width="14" height="26" rx="4" fill="#cc1111"/>
            <rect x="-18" y="22" width="12" height="26" rx="4" fill="#cc1111"/>
            <rect x="6" y="22" width="12" height="26" rx="4" fill="#cc1111"/>
            <rect x="28" y="22" width="14" height="26" rx="4" fill="#cc1111"/>
          </g>

          <rect x="700" y="540" width="520" height="24" fill="#ffffff" />
          <rect x="460" y="90" width="1000" height="700" fill="url(#scanlines)" pointer-events="none" />
        </g>

        <!-- 2 Biển tam giác vàng dạt sang 2 bên màn hình máy tính -->
        <g id="warning-layer" style="display: none;">
          <g transform="translate(260, 480) scale(1.15)">
            <use href="#warning-triangle" />
          </g>
          <g transform="translate(1660, 480) scale(1.15)">
            <use href="#warning-triangle" />
          </g>
        </g>
      </svg>
    </div>
  </div>

  <!-- BƯỚC 4: ĐẾM NGƯỢC CHỮ ĐỎ -->
  <div id="step-countdown" class="screen">
    <div id="countdown-display" class="countdown-text">TỰ HUỶ TRONG 3</div>
  </div>

  <!-- BƯỚC 5: VỤ NỔ NGUYÊN TỬ TOÀN MÀN HÌNH -->
  <div id="step-explosion" class="screen">
    <div class="nuclear-flash"></div>
    <img id="explosion-gif" class="explosion-gif" src="" alt="Explosion">
  </div>

  <!-- BƯỚC 6: TẮT LỊM ĐEN KỊT HOÀN TOÀN -->
  <div id="step-blackout" class="screen"></div>

  <script>
    const btnFs = document.getElementById('btn-fs');
    const btnTrigger = document.getElementById('btn-trigger');
    const warningLayer = document.getElementById('warning-layer');
    const countdownDisplay = document.getElementById('countdown-display');
    const explosionGif = document.getElementById('explosion-gif');
    const stepExplosion = document.getElementById('step-explosion');

    const screens = {
      fs: document.getElementById('step-fs-request'),
      trigger: document.getElementById('step-trigger'),
      loading: document.getElementById('step-loading'),
      virus: document.getElementById('step-virus'),
      countdown: document.getElementById('step-countdown'),
      explosion: stepExplosion,
      blackout: document.getElementById('step-blackout')
    };

    function showScreen(key) {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      if (screens[key]) {
        screens[key].classList.add('active');
      }
    }

    const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // ==========================================
    // HỆ THỐNG ÂM THANH KÉP (TỰ ĐỘNG DỰ PHÒNG HOÀN TOÀN)
    // ==========================================
    let audioCtx = null;
    let sirenInterval = null;
    let isSirenActive = false;

    // File âm thanh trực tuyến
    const avastOnlineAudio = new Audio('https://www.myinstants.com/media/sounds/avast-4-8-caution-a-virus-has-been-detected.mp3');
    avastOnlineAudio.preload = 'auto';
    avastOnlineAudio.loop = true;

    const explosionOnlineAudio = new Audio('https://soundbible.com/grab.php?id=1807&type=mp3');
    explosionOnlineAudio.preload = 'auto';

    function initAudio() {
      try {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass && !audioCtx) {
          audioCtx = new AudioClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {}

      // Mở khóa autoplay cho tệp audio mạng ngay khi user click
      try {
        avastOnlineAudio.play().then(() => {
          avastOnlineAudio.pause();
          avastOnlineAudio.currentTime = 0;
        }).catch(() => {});

        explosionOnlineAudio.play().then(() => {
          explosionOnlineAudio.pause();
          explosionOnlineAudio.currentTime = 0;
        }).catch(() => {});
      } catch (e) {}
    }

    // Còi hú Avast 4.8 Wee-Woo (Chạy song song bằng Web Audio API)
    function startAvastSirenLoop() {
      if (isSirenActive) return;
      isSirenActive = true;

      // 1. Thử phát audio thật từ mạng
      try {
        avastOnlineAudio.currentTime = 0;
        avastOnlineAudio.play().catch(() => {});
      } catch (e) {}

      // 2. Chạy còi hú Wee-Woo dồn dập (760Hz - 980Hz)
      if (audioCtx) {
        let isHighTone = true;
        const playTone = () => {
          if (!isSirenActive || !audioCtx) return;
          try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(isHighTone ? 980 : 760, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.17);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.17);
            isHighTone = !isHighTone;
          } catch (e) {}
        };
        playTone();
        sirenInterval = setInterval(playTone, 180);
      }

      // 3. Fallback đọc giọng cảnh báo nếu audio mạng bị chặn
      speakAvastFallback();
    }

    function speakAvastFallback() {
      if (!isSirenActive || !('speechSynthesis' in window)) return;
      const speak = () => {
        if (!isSirenActive) return;
        const utterance = new SpeechSynthesisUtterance("Caution! A virus has been detected!");
        utterance.lang = 'en-US';
        utterance.rate = 1.0;
        utterance.pitch = 1.15;
        utterance.onend = () => {
          if (isSirenActive) setTimeout(speak, 400);
        };
        window.speechSynthesis.speak(utterance);
      };
      speak();
    }

    function stopAllAvastSounds() {
      isSirenActive = false;
      if (sirenInterval) {
        clearInterval(sirenInterval);
        sirenInterval = null;
      }
      try {
        avastOnlineAudio.pause();
        avastOnlineAudio.currentTime = 0;
      } catch (e) {}

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    // Tiếng bíp đếm ngược
    function playBeep(freq = 800, duration = 0.18) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Âm thanh vụ nổ nguyên tử (Phát tệp mạng + Sub-bass & Shockwave Web Audio)
    function triggerExplosionSFX() {
      // Phát file âm thanh nổ trực tuyến
      try {
        explosionOnlineAudio.currentTime = 0;
        explosionOnlineAudio.volume = 1.0;
        explosionOnlineAudio.play().catch(() => {});
      } catch (e) {}

      // Bộ tổng hợp sóng xung kích âm trầm
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;

        // Sub-bass rền cực mạnh
        const subOsc = audioCtx.createOscillator();
        const subGain = audioCtx.createGain();
        subOsc.type = 'sine';
        subOsc.frequency.setValueAtTime(140, now);
        subOsc.frequency.exponentialRampToValueAtTime(20, now + 1.2);

        subGain.gain.setValueAtTime(0.9, now);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 1.3);

        subOsc.connect(subGain);
        subGain.connect(audioCtx.destination);
        subOsc.start(now);
        subOsc.stop(now + 1.3);

        // Tiếng gầm sóng xung kích shockwave
        const bufferSize = audioCtx.sampleRate * 1.3;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        let lastOut = 0.0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          data[i] = (lastOut + (0.02 * white)) / 1.02;
          lastOut = data[i];
          data[i] *= 3.5;
        }

        const noiseSrc = audioCtx.createBufferSource();
        noiseSrc.buffer = noiseBuffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1200, now);
        filter.frequency.exponentialRampToValueAtTime(60, now + 1.2);

        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(1.0, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 1.3);

        noiseSrc.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        noiseSrc.start(now);
        noiseSrc.stop(now + 1.3);
      } catch (e) {}
    }

    // ==========================================
    // KỊCH BẢN TƯƠNG TÁC
    // ==========================================

    // BƯỚC 0: Nhấn Bật toàn màn hình
    btnFs.addEventListener('click', () => {
      try {
        const el = document.documentElement;
        if (el.requestFullscreen) {
          el.requestFullscreen().catch(() => {});
        } else if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
        } else if (el.msRequestFullscreen) {
          el.msRequestFullscreen();
        }
      } catch (e) {}

      initAudio();
      showScreen('trigger');
    }, { once: true });

    // BƯỚC 1 -> HẾT: Bấm vào đây
    btnTrigger.addEventListener('click', async () => {
      initAudio();

      // 1. Loading xoay tròn 3 giây
      showScreen('loading');
      await wait(3000);

      // 2. Màn hình virus chuyển đổi 5 lần (1 giây/lần)
      showScreen('virus');
      let warningActive = false;

      for (let i = 0; i < 5; i++) {
        warningActive = !warningActive;
        warningLayer.style.display = warningActive ? 'block' : 'none';

        if (warningActive) {
          startAvastSirenLoop();
        }

        await wait(1000);
      }

      // Ngắt hoàn toàn âm thanh Avast trước khi đếm ngược
      stopAllAvastSounds();

      // 3. Đếm ngược tự huỷ chữ đỏ
      showScreen('countdown');
      countdownDisplay.textContent = "TỰ HUỶ TRONG 3";
      playBeep(750, 0.2);
      await wait(1000);

      countdownDisplay.textContent = "TỰ HUỶ TRONG 2";
      playBeep(750, 0.2);
      await wait(1000);

      countdownDisplay.textContent = "TỰ HUỶ TRONG 1";
      playBeep(1100, 0.3);
      await wait(1000);

      // 4. Kích hoạt vụ nổ hạt nhân Atomic Explosion
      triggerExplosionSFX();
      const gifUrl = "https://i.pinimg.com/originals/48/bc/a3/48bca33b14b5609d2da2552527a513a9.gif";
      explosionGif.src = gifUrl + "?t=" + Date.now();
      stepExplosion.classList.add('shake-anim');
      showScreen('explosion');

      // Đúng 1 chu kỳ nổ (1.3 giây)
      await wait(1300);

      // 5. Tắt lịm hoàn toàn sang màn hình đen vĩnh viễn
      explosionGif.src = "";
      stepExplosion.classList.remove('shake-anim');
      showScreen('blackout');
    }, { once: true });
  </script>
</body>
</html>
