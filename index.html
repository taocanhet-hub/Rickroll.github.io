<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cảnh Báo Tự Hủy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Font chữ mặc định chuẩn Arial */
    body, * {
      font-family: Arial, Helvetica, sans-serif !important;
      user-select: none;
    }

    /* Hiệu ứng sọc CRT quét ngang tăng cảm giác máy tính cổ */
    .crt-scanlines {
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0) 50%,
        rgba(0, 0, 0, 0.35) 50%,
        rgba(0, 0, 0, 0.35)
      );
      background-size: 100% 4px;
      pointer-events: none;
    }

    /* Hiệu ứng chớp sáng khi kích hoạt GIF nổ */
    @keyframes explosion-flash {
      0% { opacity: 0.9; }
      15% { opacity: 0; }
      100% { opacity: 0; }
    }

    .flash-overlay {
      animation: explosion-flash 0.5s ease-out forwards;
    }
  </style>
</head>
<body class="w-screen h-screen m-0 p-0 bg-white flex items-center justify-center overflow-hidden transition-colors duration-200">

  <!-- ==================== 0. MÀN HÌNH YÊU CẦU TOÀN MÀN HÌNH ==================== -->
  <section id="step-fullscreen-prompt" class="flex flex-col items-center justify-center w-full h-full text-center px-4">
    <p class="text-gray-700 text-base mb-4 font-normal">Vui lòng bật toàn màn hình để tiếp tục</p>
    <button 
      id="btn-fullscreen" 
      class="px-6 py-2.5 bg-gray-900 hover:bg-black text-white text-base font-normal rounded cursor-pointer transition-colors shadow-sm outline-none border-none"
    >
      Bật toàn màn hình
    </button>
  </section>

  <!-- ==================== 1. MÀN HÌNH BẮT ĐẦU: CỰC KỲ TỐI GIẢN ==================== -->
  <section id="step-start" class="hidden flex items-center justify-center w-full h-full">
    <button 
      id="btn-click" 
      class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-base font-normal rounded cursor-pointer transition-colors shadow-sm outline-none border-none"
    >
      Bấm vào đây
    </button>
  </section>

  <!-- ==================== 2. MÀN HÌNH LOADING TRONG 3 GIÂY ==================== -->
  <section id="step-loading" class="hidden flex-col items-center justify-center gap-3">
    <div class="w-10 h-10 border-4 border-gray-200 border-t-blue-600 rounded-full animate-spin"></div>
    <span class="text-sm text-gray-500 font-normal">Đang tải...</span>
  </section>

  <!-- ==================== 3. MÀN HÌNH ĐỒ HỌA CRT NGUY HIỂM ==================== -->
  <section id="step-graphic" class="hidden absolute inset-0 w-full h-full bg-black flex items-center justify-center overflow-hidden">
    <!-- Lớp lưới sọc quét CRT -->
    <div class="crt-scanlines absolute inset-0 z-20"></div>

    <!-- Đồ họa Vector SVG tái hiện chính xác 2 bức ảnh gốc -->
    <svg id="scene-svg" viewBox="0 0 1920 1080" class="w-full h-full max-w-full max-h-full object-contain" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- Họa tiết dải sọc chéo Hazard đỏ và đen -->
        <pattern id="hazardStripes" width="160" height="160" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="0" y2="160" stroke="#990b14" stroke-width="80" />
          <line x1="80" y1="0" x2="80" y2="160" stroke="#0f0506" stroke-width="80" />
        </pattern>

        <!-- Ký hiệu Nguy Hiểm Sinh Học (Biohazard) -->
        <g id="biohazard-symbol" fill="#000000" fill-opacity="0.82">
          <circle cx="0" cy="-35" r="30" />
          <circle cx="-30" cy="20" r="30" />
          <circle cx="30" cy="20" r="30" />
          <circle cx="0" cy="0" r="16" fill="#990b14" />
          <circle cx="0" cy="0" r="7" fill="#000000" />
          <circle cx="0" cy="-35" r="14" fill="#990b14" />
          <circle cx="-30" cy="20" r="14" fill="#990b14" />
          <circle cx="30" cy="20" r="14" fill="#990b14" />
          <circle cx="0" cy="0" r="38" stroke="#000000" stroke-width="7" fill="none" />
          <circle cx="0" cy="-35" r="24" fill="#990b14" opacity="0.32"/>
          <circle cx="-30" cy="20" r="24" fill="#990b14" opacity="0.32"/>
          <circle cx="30" cy="20" r="24" fill="#990b14" opacity="0.32"/>
        </g>

        <!-- Biển Cảnh Báo Tam Giác Vàng Chấm Than -->
        <g id="warning-triangle">
          <polygon points="0,-185 160,105 -160,105" fill="#000000" stroke="#000000" stroke-width="14" stroke-linejoin="round" />
          <polygon points="0,-175 148,97 -148,97" fill="#fde047" stroke="#000000" stroke-width="8" stroke-linejoin="round" />
          <polygon points="0,-155 130,85 -130,85" fill="none" stroke="#333333" stroke-width="3" stroke-linejoin="round" opacity="0.4" />
          <path d="M-9,-95 L9,-95 L6,15 L-6,15 Z" fill="#000000" />
          <circle cx="0" cy="50" r="11" fill="#000000" />
        </g>
      </defs>

      <!-- Nền sọc Hazard đỏ đen -->
      <rect width="1920" height="1080" fill="url(#hazardStripes)" />
      <rect width="1920" height="1080" fill="rgba(0,0,0,0.18)" />

      <!-- Các biểu tượng Biohazard phân bổ nền trái và phải -->
      <use href="#biohazard-symbol" transform="translate(230, 210) scale(1.6)" />
      <use href="#biohazard-symbol" transform="translate(280, 500) scale(1.7)" />
      <use href="#biohazard-symbol" transform="translate(210, 810) scale(1.6)" />
      <use href="#biohazard-symbol" transform="translate(520, 910) scale(1.6)" />
      <use href="#biohazard-symbol" transform="translate(1690, 230) scale(1.6)" />
      <use href="#biohazard-symbol" transform="translate(1670, 520) scale(1.7)" />
      <use href="#biohazard-symbol" transform="translate(1640, 820) scale(1.6)" />

      <!-- MÁY TÍNH CRT CỔ ĐIỂN Ở TRUNG TÂM -->
      <g transform="translate(960, 540)">
        <!-- Đế màn hình máy tính -->
        <path d="M-280,410 L280,410 L220,335 L-220,335 Z" fill="#2d2b78" stroke="#100f36" stroke-width="6" />
        <path d="M-220,335 L220,335 L160,250 L-160,250 Z" fill="#353496" stroke="#100f36" stroke-width="5" />
        <rect x="-140" y="210" width="280" height="48" fill="#282672" stroke="#100f36" stroke-width="5" />

        <!-- Vỏ ngoài màn hình CRT xanh tím -->
        <rect x="-500" y="-450" width="1000" height="690" rx="16" fill="#3836a0" stroke="#0e0c3b" stroke-width="12" />
        <g stroke="#262474" stroke-width="4">
          <line x1="-480" y1="-420" x2="480" y2="-420" />
          <line x1="-480" y1="-390" x2="480" y2="-390" />
          <line x1="-480" y1="210" x2="480" y2="210" />
          <line x1="-480" y1="180" x2="480" y2="180" />
        </g>
        <rect x="-420" y="-380" width="840" height="550" rx="8" fill="#1d1b5a" stroke="#090825" stroke-width="8" />

        <!-- Màn hình bên trong màu đỏ cảnh báo -->
        <rect x="-370" y="-330" width="740" height="450" fill="#dc2626" stroke="#ffffff" stroke-width="10" />
        
        <!-- Các vệt quét đen trên nền đỏ -->
        <g stroke="#000000" stroke-width="5" opacity="0.65">
          <line x1="-370" y1="-280" x2="370" y2="-280" />
          <line x1="-370" y1="-220" x2="370" y2="-220" />
          <line x1="-370" y1="-160" x2="370" y2="-160" />
          <line x1="-370" y1="-100" x2="370" y2="-100" />
          <line x1="-370" y1="-40" x2="370" y2="-40" />
          <line x1="-370" y1="20" x2="370" y2="20" />
          <line x1="-370" y1="80" x2="370" y2="80" />
        </g>

        <!-- ĐẦU LÂU XƯƠNG CHÉO RETRO -->
        <g fill="#ffffff" stroke="#000000" stroke-width="3">
          <!-- Cặp xương chéo -->
          <circle cx="-135" cy="-95" r="16" />
          <circle cx="-100" cy="-125" r="16" />
          <circle cx="135" cy="95" r="16" />
          <circle cx="100" cy="125" r="16" />
          <rect x="-115" y="-105" width="230" height="28" transform="rotate(35)" rx="6" />

          <circle cx="135" cy="-95" r="16" />
          <circle cx="100" cy="-125" r="16" />
          <circle cx="-135" cy="95" r="16" />
          <circle cx="-100" cy="125" r="16" />
          <rect x="-115" y="-105" width="230" height="28" transform="rotate(-35)" rx="6" />

          <!-- Hộp sọ chính -->
          <ellipse cx="0" cy="-80" rx="90" ry="85" />
          <rect x="-55" y="-20" width="110" height="65" rx="14" />
          
          <!-- Hốc mắt và mũi -->
          <ellipse cx="-35" cy="-80" rx="22" ry="24" fill="#000000" stroke="none" />
          <ellipse cx="35" cy="-80" rx="22" ry="24" fill="#000000" stroke="none" />
          <path d="M-8,-45 L8,-45 L0,-62 Z" fill="#000000" stroke="none" />

          <!-- Hàm răng -->
          <g fill="#ffffff" stroke="#000000" stroke-width="3">
            <rect x="-40" y="10" width="16" height="22" rx="3" />
            <rect x="-20" y="10" width="16" height="22" rx="3" />
            <rect x="4" y="10" width="16" height="22" rx="3" />
            <rect x="24" y="10" width="16" height="22" rx="3" />
          </g>
        </g>

        <!-- Thanh progress bar phía dưới -->
        <rect x="-280" y="70" width="560" height="18" fill="#ffffff" stroke="#000000" stroke-width="2" />
      </g>

      <!-- 2 BIỂN CẢNH BÁO TAM GIÁC (THU NHỎ & DẠT SANG HAI CÁNH, KHÔNG ĐÈ LÊN MÀN HÌNH) -->
      <g id="warning-signs" class="hidden">
        <use href="#warning-triangle" transform="translate(230, 540) scale(1.15)" />
        <use href="#warning-triangle" transform="translate(1690, 540) scale(1.15)" />
      </g>
    </svg>
  </section>

  <!-- ==================== 4. MÀN HÌNH NỀN ĐEN CHỮ ĐỎ ĐẾM LÙI ==================== -->
  <section id="step-countdown" class="hidden absolute inset-0 w-full h-full bg-black flex items-center justify-center">
    <h1 id="countdown-text" class="text-red-600 font-bold text-4xl sm:text-6xl md:text-7xl tracking-wider text-center px-4">
      TỰ HUỶ TRONG 3
    </h1>
  </section>

  <!-- ==================== 5. MÀN HÌNH KẾT THÚC: GIF NỔ TOÀN MÀN HÌNH ==================== -->
  <section id="step-explosion" class="hidden absolute inset-0 w-full h-full bg-black flex items-center justify-center overflow-hidden">
    <!-- Ảnh GIF toàn màn hình -->
    <img 
      id="explosion-gif"
      src="https://i.pinimg.com/originals/48/bc/a3/48bca33b14b5609d2da2552527a513a9.gif" 
      alt="Explosion GIF" 
      class="absolute inset-0 w-full h-full object-cover z-0 pointer-events-none"
    />

    <!-- Chớp sáng trắng khi nổ -->
    <div id="flash-effect" class="absolute inset-0 bg-white pointer-events-none z-10 hidden"></div>
  </section>

  <!-- ==================== 6. MÀN HÌNH ĐEN HOÀN TOÀN (SAU KHI GIF KẾT THÚC) ==================== -->
  <section id="step-blackout" class="hidden absolute inset-0 w-full h-full bg-black z-50 pointer-events-none"></section>

  <!-- ==================== LOGIC KỊCH BẢN CHÍNH ==================== -->
  <script>
    const stepFullscreenPrompt = document.getElementById('step-fullscreen-prompt');
    const stepStart = document.getElementById('step-start');
    const stepLoading = document.getElementById('step-loading');
    const stepGraphic = document.getElementById('step-graphic');
    const stepCountdown = document.getElementById('step-countdown');
    const stepExplosion = document.getElementById('step-explosion');
    const stepBlackout = document.getElementById('step-blackout');

    const btnFullscreen = document.getElementById('btn-fullscreen');
    const btnClick = document.getElementById('btn-click');
    const warningSigns = document.getElementById('warning-signs');
    const countdownText = document.getElementById('countdown-text');
    const explosionGif = document.getElementById('explosion-gif');
    const flashEffect = document.getElementById('flash-effect');

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // Bước 0: Yêu cầu bật toàn màn hình trước khi hiển thị nút "Bấm vào đây"
    btnFullscreen.addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) {
          if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
          } else if (document.documentElement.webkitRequestFullscreen) {
            await document.documentElement.webkitRequestFullscreen();
          } else if (document.documentElement.msRequestFullscreen) {
            await document.documentElement.msRequestFullscreen();
          }
        }
      } catch (err) {
        console.warn('Không thể tự động kích hoạt toàn màn hình:', err);
      }

      stepFullscreenPrompt.classList.add('hidden');
      stepStart.classList.remove('hidden');
      stepStart.classList.add('flex');
    }, { once: true });

    // Bắt đầu khi nhấn nút "Bấm vào đây" (chỉ chạy đúng 1 lần duy nhất)
    btnClick.addEventListener('click', async () => {
      // 1. Chuyển sang màn hình Loading trong đúng 3 giây (3000ms)
      stepStart.classList.add('hidden');
      stepStart.classList.remove('flex');
      stepLoading.classList.remove('hidden');
      stepLoading.classList.add('flex');

      await sleep(3000);

      // 2. Hiện màn hình đồ họa
      stepLoading.classList.add('hidden');
      stepLoading.classList.remove('flex');
      stepGraphic.classList.remove('hidden');

      // Ảnh 1 hiển thị trước (không có tam giác vàng)
      let hasWarning = false;
      warningSigns.classList.add('hidden');

      // Chuyển qua chuyển lại đúng 5 lần, mỗi lần cách nhau 1 giây:
      for (let i = 0; i < 5; i++) {
        await sleep(1000);
        hasWarning = !hasWarning;
        if (hasWarning) {
          warningSigns.classList.remove('hidden');
        } else {
          warningSigns.classList.add('hidden');
        }
      }

      // Giữ thêm 1s sau lần chuyển thứ 5 rồi sang đếm ngược
      await sleep(1000);
      stepGraphic.classList.add('hidden');

      // 3. Nền đen hoàn toàn, chữ đỏ "TỰ HUỶ TRONG 3" -> 2 -> 1
      stepCountdown.classList.remove('hidden');
      stepCountdown.classList.add('flex');

      countdownText.textContent = "TỰ HUỶ TRONG 3";
      await sleep(1000);

      countdownText.textContent = "TỰ HUỶ TRONG 2";
      await sleep(1000);

      countdownText.textContent = "TỰ HUỶ TRONG 1";
      await sleep(1000);

      // 4. Màn hình nổ GIF (chỉ hiển thị đúng 1 chu kỳ nổ duy nhất ~1.3s)
      stepCountdown.classList.add('hidden');
      stepCountdown.classList.remove('flex');

      // Tải lại GIF kèm timestamp để bắt đầu chính xác từ frame đầu tiên
      const baseGifUrl = "https://i.pinimg.com/originals/48/bc/a3/48bca33b14b5609d2da2552527a513a9.gif";
      explosionGif.src = baseGifUrl + "?t=" + Date.now();

      stepExplosion.classList.remove('hidden');
      stepExplosion.classList.add('flex');

      // Kích hoạt chớp sáng nổ
      flashEffect.classList.remove('hidden');
      flashEffect.classList.add('flash-overlay');
      setTimeout(() => {
        flashEffect.classList.add('hidden');
        flashEffect.classList.remove('flash-overlay');
      }, 400);

      // 5. Cắt ngắn thời gian xuống 1300ms để bắt trọn 1 lần nổ và không kịp loop lần 2
      await sleep(1300);
      explosionGif.src = ""; // Huỷ load GIF để ngắt hoàn toàn
      stepExplosion.classList.add('hidden');
      stepExplosion.classList.remove('flex');
      stepBlackout.classList.remove('hidden');
      document.body.style.backgroundColor = '#000000';
    }, { once: true });
  </script>
</body>
</html>
